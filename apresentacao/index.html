<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Apresentação</title>
<style>
  :root{--bg:#173520;--fg:#fff;--dim:rgba(255,255,255,.4);--arrow:rgba(255,255,255,.9)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  .deck{position:fixed;inset:0;display:flex;transition:transform .55s cubic-bezier(.65,.05,.2,1)}
  .slide{min-width:100vw;height:100vh;flex:0 0 100vw;display:flex;align-items:center;justify-content:center;position:relative}
  .slide img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
  .video-slide{cursor:pointer}
  .video-slide .thumb{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
  .play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.85);transition:transform .25s ease,background .25s ease;pointer-events:none}
  .video-slide:hover .play-btn{transform:translate(-50%,-50%) scale(1.08);background:rgba(0,0,0,.7)}
  .video-slide.play-right .play-btn{left:75%}
  .video-slide.play-right:hover .play-btn{transform:translate(-50%,-50%) scale(1.08)}
  .play-btn::after{content:"";display:block;margin-left:6px;border-style:solid;border-width:15px 0 15px 26px;border-color:transparent transparent transparent #fff}
  .nav{position:fixed;top:50%;transform:translateY(-50%);width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.25);backdrop-filter:blur(4px);border:none;cursor:pointer;z-index:30;display:flex;align-items:center;justify-content:center;transition:background .25s ease,opacity .3s ease;opacity:.65}
  .nav:hover{background:rgba(0,0,0,.5);opacity:1}
  .nav svg{width:26px;height:26px;stroke:var(--arrow);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .nav.prev{left:24px}.nav.next{right:24px}
  .nav-hint{position:fixed;right:16px;top:calc(50% + 44px);z-index:30;color:rgba(255,255,255,.75);font-size:10px;letter-spacing:.4px;max-width:90px;text-align:center;line-height:1.3;transition:opacity .4s ease;pointer-events:none}
  .nav-hint.hide{opacity:0}
  .restart-btn{position:fixed;top:24px;right:24px;z-index:40;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:24px;padding:10px 18px;font-size:13px;letter-spacing:.3px;cursor:pointer;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .35s ease,transform .35s ease,background .25s ease}
  .restart-btn.show{opacity:1;transform:translateY(0);pointer-events:auto}
  .restart-btn:hover{background:rgba(0,0,0,.7)}
  .nav:disabled{opacity:0;pointer-events:none}
  .nav.next.pulse svg{animation:slideRight .45s ease}
  .nav.prev.pulse svg{animation:slideLeft .45s ease}
  @keyframes slideRight{0%{transform:translateX(0)}45%{transform:translateX(9px);opacity:.3}100%{transform:translateX(0)}}
  @keyframes slideLeft{0%{transform:translateX(0)}45%{transform:translateX(-9px);opacity:.3}100%{transform:translateX(0)}}
  .footer-bar{position:fixed;bottom:0;left:0;right:0;height:58px;z-index:20;background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0));pointer-events:none}
  .dots{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:30;max-width:80vw;flex-wrap:wrap;justify-content:center}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);transition:all .3s ease;cursor:pointer;border:none;padding:0}
  .dot.active{background:var(--fg);width:22px;border-radius:4px}
  .counter{position:fixed;bottom:20px;right:24px;z-index:30;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .video-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .3s ease}
  .video-overlay.open{display:flex;opacity:1}
  .video-frame{position:relative;width:min(90vw,1100px);aspect-ratio:16/9}
  .video-frame iframe{width:100%;height:100%;border:0;border-radius:8px}
  .close-video{position:absolute;top:-46px;right:0;background:none;border:none;cursor:pointer;color:#fff;font-size:30px;line-height:1;opacity:.8;transition:opacity .2s}
  .close-video:hover{opacity:1}
  @media (max-width:640px){.nav{width:48px;height:48px}.nav.prev{left:10px}.nav.next{right:10px}.play-btn{width:68px;height:68px}.counter{display:none}}
</style>
</head>
<body>
  <div class="deck" id="deck">
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034993/Slide1_wlqw1x.jpg" alt="Slide 1"></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034993/Slide2_osxsbj.jpg" alt="Slide 2"></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034993/Slide3_nupghx.jpg" alt="Slide 3"></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034993/Slide4_gkme8u.jpg" alt="Slide 4"></section>
    <section class="slide video-slide play-right" data-youtube="l2cGb0tNh-g"><img class="thumb" src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034993/Slide5_kk0vtn.jpg" alt="Slide 5"><div class="play-btn"></div></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034993/Slide6_cmrpl2.jpg" alt="Slide 6"></section>
    <section class="slide video-slide" data-youtube="fnNMOl7QK9A"><img class="thumb" src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786050529/d660a04d-2984-451b-9a68-94ba6289f436.png" alt="Slide 7"><div class="play-btn"></div></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034994/Slide8_lp2gjb.jpg" alt="Slide 8"></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034994/Slide9_t9lpax.jpg" alt="Slide 9"></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034994/Slide10_zsya3e.jpg" alt="Slide 10"></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034994/Slide11_fdw1p2.jpg" alt="Slide 11"></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034994/Slide12_zsoodw.jpg" alt="Slide 12"></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034994/Slide13_kgrxfu.jpg" alt="Slide 13"></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034998/Slide14_pc7m9w.jpg" alt="Slide 14"></section>
    <section class="slide video-slide" data-youtube="_MWFCnFKi6c"><img class="thumb" src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034998/Slide15_hymo4q.jpg" alt="Slide 15"><div class="play-btn"></div></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034999/Slide16_c02brj.jpg" alt="Slide 16"></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034999/Slide17_bagcz3.jpg" alt="Slide 17"></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034999/Slide18_orhwks.jpg" alt="Slide 18"></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786034999/Slide19_bkzxwx.jpg" alt="Slide 19"></section>
    <section class="slide"><img src="https://res.cloudinary.com/dnnnn7njk/image/upload/v1786035003/Slide20_wrlilk.jpg" alt="Slide 20"></section>
  </div>
  <button class="nav prev" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
  <button class="nav next" id="next" aria-label="Próximo"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
  <div class="nav-hint" id="navHint">Clique para passar para o lado</div>
  <button class="restart-btn" id="restartBtn">Voltar ao início</button>
  <div class="footer-bar"></div>
  <div class="dots" id="dots"></div>
  <div class="counter" id="counter"></div>
  <div class="video-overlay" id="overlay">
    <div class="video-frame">
      <button class="close-video" id="closeVideo" aria-label="Fechar">&times;</button>
      <iframe id="ytFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>
<script>
(function(){
  const deck=document.getElementById('deck');
  const slides=Array.from(deck.children);
  const total=slides.length;
  const prev=document.getElementById('prev');
  const next=document.getElementById('next');
  const dotsWrap=document.getElementById('dots');
  const counter=document.getElementById('counter');
  const overlay=document.getElementById('overlay');
  const ytFrame=document.getElementById('ytFrame');
  const closeVideo=document.getElementById('closeVideo');
  const navHint=document.getElementById('navHint');
  const restartBtn=document.getElementById('restartBtn');
  let i=0;
  slides.forEach((_,idx)=>{const d=document.createElement('button');d.className='dot'+(idx===0?' active':'');d.addEventListener('click',()=>go(idx));dotsWrap.appendChild(d);});
  const dots=Array.from(dotsWrap.children);
  function render(){deck.style.transform='translateX('+(-i*100)+'vw)';dots.forEach((d,idx)=>d.classList.toggle('active',idx===i));counter.textContent=String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');prev.disabled=i===0;next.disabled=i===total-1;navHint.classList.toggle('hide',i!==0);restartBtn.classList.toggle('show',i===total-1);}
  function go(n){i=Math.max(0,Math.min(total-1,n));render();}
  function pulse(btn){btn.classList.add('pulse');setTimeout(()=>btn.classList.remove('pulse'),450);}
  next.addEventListener('click',()=>{if(i<total-1){pulse(next);go(i+1);}});
  prev.addEventListener('click',()=>{if(i>0){pulse(prev);go(i-1);}});
  document.addEventListener('keydown',e=>{if(overlay.classList.contains('open')){if(e.key==='Escape')close();return;}if(e.key==='ArrowRight'||e.key===' '){if(i<total-1){pulse(next);go(i+1);}}if(e.key==='ArrowLeft'){if(i>0){pulse(prev);go(i-1);}}});
  let sx=0;
  deck.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
  deck.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){dx<0?next.click():prev.click();}},{passive:true});
  slides.forEach(s=>{if(s.classList.contains('video-slide')){s.addEventListener('click',()=>{const id=s.getAttribute('data-youtube');ytFrame.src='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0';overlay.classList.add('open');});}});
  restartBtn.addEventListener('click',()=>go(0));
  function close(){overlay.classList.remove('open');ytFrame.src='';}
  closeVideo.addEventListener('click',close);
  overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
  render();
})();
</script>
</body>
</html>
